name: AI Daily News

on:
  schedule:
    # Run 3 times daily in AEST timezone (UTC+11 for AEDT, UTC+10 for AEST)
    # 8am AEST: 22:00 UTC (previous day) for AEST or 21:00 UTC for AEDT
    - cron: '0 22 * * *'  # 8am AEST (non-daylight saving)
    # 12pm AEST: 02:00 UTC
    - cron: '0 2 * * *'   # 12pm AEST
    # 5pm AEST: 07:00 UTC
    - cron: '0 7 * * *'   # 5pm AEST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run AI Daily News
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python main.py
