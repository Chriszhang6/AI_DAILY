name: AI Daily News

permissions:
  contents: write

on:
  schedule:
    # Run once daily in Australian Eastern time
    # Note: This time is fixed in UTC and does not automatically adjust for daylight saving
    # During AEST (Apr-Oct, UTC+10): 8am local time
    # During AEDT (Oct-Apr, UTC+11): 9am local time
    - cron: '0 22 * * *'  # 8am AEST / 9am AEDT
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run AI Daily News
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python main.py
      - name: Deploy to GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/index.html
          git diff --staged --quiet || git commit -m "Update daily news - $(date +'%Y-%m-%d')"
          git push
